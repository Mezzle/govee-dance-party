<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="0.25" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="0.75" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#475569"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="ballclip"><circle cx="128" cy="96" r="46"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- light beams from the ball -->
  <g opacity="0.55" filter="url(#softglow)">
    <polygon points="128,96 10,40 10,90" fill="#f43f5e"/>
    <polygon points="128,96 40,236 110,246" fill="#f59e0b"/>
    <polygon points="128,96 246,40 246,90" fill="#3b82f6"/>
    <polygon points="128,96 216,236 146,246" fill="#a855f7"/>
  </g>

  <!-- chain -->
  <rect x="125" y="14" width="6" height="40" rx="3" fill="#94a3b8"/>

  <!-- disco ball -->
  <circle cx="128" cy="96" r="46" fill="url(#ball)"/>
  <g clip-path="url(#ballclip)" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.7">
    <line x1="82" y1="72" x2="174" y2="72"/>
    <line x1="82" y1="88" x2="174" y2="88"/>
    <line x1="82" y1="104" x2="174" y2="104"/>
    <line x1="82" y1="120" x2="174" y2="120"/>
    <line x1="104" y1="50" x2="104" y2="142"/>
    <line x1="120" y1="50" x2="120" y2="142"/>
    <line x1="136" y1="50" x2="136" y2="142"/>
    <line x1="152" y1="50" x2="152" y2="142"/>
    <ellipse cx="128" cy="96" rx="22" ry="46"/>
    <ellipse cx="128" cy="96" rx="46" ry="18"/>
  </g>
  <!-- mirror glints -->
  <g fill="#ffffff" filter="url(#glow)">
    <rect x="109" y="76" width="9" height="9" opacity="0.95"/>
    <rect x="141" y="92" width="9" height="9" opacity="0.8"/>
    <rect x="121" y="108" width="9" height="9" opacity="0.7"/>
  </g>
  <circle cx="128" cy="96" r="46" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>

  <!-- LED strip along the bottom, same as the Govee-Bluetooth icon -->
  <g transform="rotate(-8 128 196)">
    <rect x="12" y="174" width="232" height="44" rx="10" fill="#111827" stroke="#334155" stroke-width="3"/>
    <rect x="18" y="180" width="220" height="32" rx="7" fill="url(#strip)" opacity="0.9"/>
    <g fill="#ffffff" opacity="0.95" filter="url(#glow)">
      <circle cx="44" cy="196" r="7"/>
      <circle cx="86" cy="196" r="7"/>
      <circle cx="128" cy="196" r="7"/>
      <circle cx="170" cy="196" r="7"/>
      <circle cx="212" cy="196" r="7"/>
    </g>
  </g>
</svg>
